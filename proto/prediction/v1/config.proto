syntax = "proto3";

package prediction.v1;

import "prediction/v1/common.proto";

option go_package = "prediction-service/api/proto/prediction/v1;predictionv1";

// PredictionConfigAdmin 是平台管理员和商户管理员共用的当前玩法配置入口。
// 服务根据可信 metadata 中是否存在 x-agent-id 自动确定配置范围，请求体不得选择商户身份。
service PredictionConfigAdmin {
  // Identity-derived root merchant configuration; main accounts only.
  rpc ListOwnerConfigs(ListOwnerConfigsRequest) returns (ListOwnerConfigsResponse);
  rpc GetOwnerConfig(GetOwnerConfigRequest) returns (GetOwnerConfigResponse);
  rpc SaveOwnerConfig(SaveOwnerConfigRequest) returns (SaveOwnerConfigResponse);
  // ListSymbolConfigs 查询当前可信范围内的全部交易对配置，可按玩法过滤。
  rpc ListSymbolConfigs(ListSymbolConfigsRequest) returns (ListSymbolConfigsResponse);
  // GetSymbolConfig 查询当前可信范围内一个玩法和交易对的完整多周期配置。
  rpc GetSymbolConfig(GetSymbolConfigRequest) returns (GetSymbolConfigResponse);
  // SaveSymbolConfig 保存当前玩法和交易对的完整配置，成功即发布新版本。
  rpc SaveSymbolConfig(SaveSymbolConfigRequest) returns (SaveSymbolConfigResponse);
  // GetSiteConfig 查询精确站点、玩法和交易对的已存与当前生效配置。
  rpc GetSiteConfig(GetSiteConfigRequest) returns (GetSiteConfigResponse);
  // SaveSiteConfig 保存精确站点配置；授权站点只来自服务端文件门禁。
  rpc SaveSiteConfig(SaveSiteConfigRequest) returns (SaveSiteConfigResponse);
}

enum ReconciliationJobState {
  RECONCILIATION_JOB_STATE_UNSPECIFIED = 0;
  RECONCILIATION_JOB_STATE_PENDING = 1;
  RECONCILIATION_JOB_STATE_RUNNING = 2;
  RECONCILIATION_JOB_STATE_SUCCEEDED = 3;
  RECONCILIATION_JOB_STATE_PARTIALLY_FAILED = 4;
  RECONCILIATION_JOB_STATE_FAILED = 5;
}

enum ConfigScope {
  CONFIG_SCOPE_UNSPECIFIED = 0;
  CONFIG_SCOPE_PLATFORM = 1;
  CONFIG_SCOPE_AGENT = 2;
}

message PlatformRuleTemplate {
  GameType game_type = 1;
  string symbol = 2;
  // 完整周期；UP_DOWN 新配置仅允许 35/40/45/60/90，对应 30 秒下注加 5/10/15/30/60 秒观察。
  int64 duration_seconds = 3;
  bool enabled_by_default = 4;
  IntegerConstraint bet_open_seconds = 5;
  DecimalConstraint target_payout_rate = 6;
  DecimalConstraint minimum_odds = 7;
  DecimalConstraint maximum_odds = 8;
  DecimalConstraint fixed_odds = 9;
  DecimalConstraint minimum_stake = 10;
  DecimalConstraint maximum_stake = 11;
  int64 settlement_display_seconds = 12;
  PriceRule price_rule = 13;
  // market_id 是跨配置版本稳定的市场标识，由服务端生成并回显。
  string market_id = 14;
  // UP_DOWN 只使用一个未退役的稳定技术档位（可保留退役历史档位）；HIGH_LOW 保持顶层单区间。
  repeated PlatformStakeTier stake_tiers = 15;
}

message PlatformStakeTier {
  string stake_tier_id = 1;
  bool enabled_by_default = 2;
  int32 display_order = 3;
  DecimalConstraint minimum_stake = 4;
  DecimalConstraint maximum_stake = 5;
  bool retired = 6;
}

message AgentRuleOverride {
  GameType game_type = 1;
  string symbol = 2;
  // 完整周期；UP_DOWN 页面房间时长为 duration_seconds - 30 秒。
  int64 duration_seconds = 3;
  optional bool enabled = 4;
  optional int64 bet_open_seconds = 5;
  optional string target_payout_rate = 6;
  optional string minimum_odds = 7;
  optional string maximum_odds = 8;
  optional string fixed_odds = 9;
  optional string minimum_stake = 10;
  optional string maximum_stake = 11;
  // UP_DOWN 商户只可提交唯一技术档位的 enabled/maximum_stake。
  repeated AgentStakeTierOverride stake_tiers = 12;
}

message AgentStakeTierOverride {
  string stake_tier_id = 1;
  optional bool enabled = 2;
  optional string minimum_stake = 3;
  optional string maximum_stake = 4;
}

message ForcedConfigAdjustment {
  string field = 1;
  string before_value = 2;
  string after_value = 3;
  string reason = 4;
  int64 adjusted_at_ms = 5;
}

// IntegerConfigField 让平台和商户保存回执使用同一字段结构。
// value 是当前范围的生效值，template_value 是商户不可突破的平台模板值。
message IntegerConfigField {
  int64 value = 1;
  int64 template_value = 2;
  int64 default_value = 3;
  int64 minimum_value = 4;
  int64 maximum_value = 5;
  bool agent_editable = 6;
  bool overridden = 7;
}

message DecimalConfigField {
  string value = 1;
  string template_value = 2;
  string default_value = 3;
  string minimum_value = 4;
  string maximum_value = 5;
  bool agent_editable = 6;
  bool overridden = 7;
}

// GameplayConfigRule 是统一保存回执中的扁平规则视图。
message GameplayConfigRule {
  reserved 1 to 4;
  reserved "template_rule", "agent_override", "effective_value", "value_sources";
  ConfigValidationStatus validation_status = 5;
  repeated ForcedConfigAdjustment forced_adjustments = 6;
  GameType game_type = 7;
  string symbol = 8;
  // 完整周期；UP_DOWN 页面房间时长为 duration_seconds - 30 秒。
  int64 duration_seconds = 9;
  bool enabled = 10;
  bool enabled_by_default = 11;
  IntegerConfigField bet_open_seconds = 12;
  DecimalConfigField target_payout_rate = 13;
  DecimalConfigField minimum_odds = 14;
  DecimalConfigField maximum_odds = 15;
  DecimalConfigField fixed_odds = 16;
  DecimalConfigField minimum_stake = 17;
  DecimalConfigField maximum_stake = 18;
  int64 settlement_display_seconds = 19;
  PriceRule price_rule = 20;
  string market_id = 21;
  repeated GameplayStakeTier stake_tiers = 22;
}

message GameplayStakeTier {
  string stake_tier_id = 1;
  bool enabled = 2;
  bool enabled_by_default = 3;
  int32 display_order = 4;
  DecimalConfigField minimum_stake = 5;
  DecimalConfigField maximum_stake = 6;
  bool retired = 7;
}

message GameplayConfig {
  ConfigScope scope = 1;
  // agent_id 只由服务根据可信 metadata 回显，平台范围为空。
  string agent_id = 2;
  int64 template_version = 3;
  int64 agent_version = 4;
  string effective_version = 5;
  repeated GameplayConfigRule rules = 6;
  int64 updated_at_ms = 7;
  // 独立币种总开关；房间存在状态由 enabled_by_default 表示。
  optional bool symbol_enabled = 8;
}

message PlatformSymbolConfigInput {
  // 仅控制该交易对能否出现在预测玩法页面并接受新预测订单。
  optional bool enabled = 1;
  // 平台提交当前交易对的完整配置；UP_DOWN 必须提交 35/40/45/60/90 五个完整周期。
  repeated PlatformRuleTemplate rules = 2;
}

message AgentSymbolConfigInput {
  // 仅控制该交易对能否在当前商户的预测玩法页面游玩。
  optional bool enabled = 1;
  // 只提交本次需要替换的周期；UP_DOWN 仅允许房间启停及唯一技术档位最大额。
  repeated AgentRuleOverride overrides = 2;
}

// ListSymbolConfigsRequest 不接受商户或操作人字段；查询范围只来自可信 metadata。
message ListSymbolConfigsRequest {
  // 未设置时返回 UP_DOWN 与 HIGH_LOW 的全部当前配置。
  optional GameType game_type = 1;
}

message ListSymbolConfigsResponse {
  // 每项对应一个稳定的 (game_type, symbol)，rules 包含该交易对的全部周期。
  repeated GameplayConfig configurations = 1;
}

// GetSymbolConfigRequest 不接受商户或操作人字段；查询范围只来自可信 metadata。
message GetSymbolConfigRequest {
  GameType game_type = 1;
  string symbol = 2;
}

message GetSymbolConfigResponse {
  GameplayConfig configuration = 1;
}

message SaveSymbolConfigRequest {
  reserved 1;
  reserved "schema_version";
  string client_request_id = 2;
  string reason = 3;
  int64 based_on_template_version = 4;
  int64 based_on_agent_version = 5;
  GameType game_type = 6;
  string symbol = 7;
  oneof configuration {
    PlatformSymbolConfigInput platform_template = 8;
    AgentSymbolConfigInput agent_override = 9;
  }
}

message SaveSymbolConfigResponse {
  GameplayConfig configuration = 1;
  OperationReceipt receipt = 2;
  optional TemplateReconciliationJob reconciliation_job = 3;
}

message GetSiteConfigRequest {
  string site_id = 1;
  GameType game_type = 2;
  string symbol = 3;
}

message SaveSiteConfigRequest {
  string client_request_id = 1;
  string reason = 2;
  string site_id = 3;
  GameType game_type = 4;
  string symbol = 5;
  int64 based_on_public_version = 6;
  int64 based_on_site_version = 7;
  bool enabled = 8;
  repeated AgentRuleOverride overrides = 9;
}

message SiteConfigVersion {
  string site_id = 1;
  GameType game_type = 2;
  string symbol = 3;
  int64 version = 4;
  int64 based_on_public_version = 5;
  bool enabled = 6;
  repeated AgentRuleOverride overrides = 7;
}

message SiteEffectiveRule {
  GameType game_type = 1;
  string symbol = 2;
  int64 duration_seconds = 3;
  string market_id = 4;
  repeated SiteEffectiveStakeTier stake_tiers = 5;
  bool enabled = 6;
  int64 bet_open_seconds = 7;
  string target_payout_rate = 8;
  string minimum_odds = 9;
  string maximum_odds = 10;
  string fixed_odds = 11;
  string minimum_stake = 12;
  string maximum_stake = 13;
  int64 settlement_display_seconds = 14;
  PriceRule price_rule = 15;
  ConfigValidationStatus validation_status = 16;
}

message SiteEffectiveStakeTier {
  string stake_tier_id = 1;
  bool enabled = 2;
  int32 display_order = 3;
  string minimum_stake = 4;
  string maximum_stake = 5;
  bool retired = 6;
}

message SiteEffectiveConfig {
  string site_id = 1;
  GameType game_type = 2;
  string symbol = 3;
  int64 public_version = 4;
  int64 site_version = 5;
  int64 based_on_public_version = 6;
  bool enabled = 7;
  repeated SiteEffectiveRule rules = 8;
}

message SiteConfigAdjustment {
  GameType game_type = 1;
  string symbol = 2;
  int64 duration_seconds = 3;
  string field = 4;
  string before_value = 5;
  string after_value = 6;
  string reason = 7;
}

message GetSiteConfigResponse {
  SiteConfigVersion stored = 1;
  SiteEffectiveConfig effective = 2;
  repeated SiteConfigAdjustment adjustments = 3;
}

message SaveSiteConfigResponse {
  SiteConfigVersion stored = 1;
  OperationReceipt receipt = 2;
}

message TemplateReconciliationJob {
  string job_id = 1;
  int64 template_version = 2;
  ReconciliationJobState state = 3;
  int64 scanned_count = 4;
  int64 affected_count = 5;
  int64 updated_count = 6;
  int64 failed_count = 7;
  string cursor = 8;
  int64 created_at_ms = 9;
  int64 updated_at_ms = 10;
  optional int64 completed_at_ms = 11;
}

// Owner and funding site are never accepted as writable request fields.
message ListOwnerConfigsRequest { GameType game_type = 1; }
message GetOwnerConfigRequest { GameType game_type = 1; string symbol = 2; }
message OwnerLimitChange {
  int64 duration_seconds = 1;
  string stake_tier_id = 2;
  int64 based_rule_epoch = 3;
  string minimum_stake = 4;
  string maximum_stake = 5;
  optional bool enabled = 6;
  optional string target_payout_rate = 7;
  optional string maximum_odds = 8;
  optional string fixed_odds = 9;
}
message SaveOwnerConfigRequest {
  GameType game_type = 1;
  string symbol = 2;
  int64 based_owner_revision = 3;
  repeated OwnerLimitChange changes = 4;
  string client_request_id = 5;
  string reason = 6;
  optional bool enabled = 7;
}
message OwnerEffectiveRule {
  SiteEffectiveRule rule = 1;
  int64 rule_epoch = 2;
  string platform_minimum_stake = 3;
  string platform_maximum_stake = 4;
  bool custom = 5;
  bool platform_enabled = 6;
  bool owner_enabled = 7;
  string platform_target_payout_rate = 8;
  string platform_maximum_odds = 9;
  string platform_fixed_odds = 10;
}
message OwnerConfig {
  string owner_agent_id = 1;
  GameType game_type = 2;
  string symbol = 3;
  int64 public_version = 4;
  int64 owner_revision = 5;
  repeated OwnerEffectiveRule rules = 6;
  bool enabled = 7;
  bool platform_enabled = 8;
}
message ListOwnerConfigsResponse { repeated OwnerConfig items = 1; }
message GetOwnerConfigResponse { OwnerConfig configuration = 1; }
message SaveOwnerConfigResponse { OwnerConfig configuration = 1; OperationReceipt receipt = 2; }
