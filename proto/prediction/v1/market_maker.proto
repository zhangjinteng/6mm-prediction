syntax = "proto3";

package prediction.v1;

import "prediction/v1/common.proto";

option go_package = "prediction-service/api/proto/prediction/v1;predictionv1";

// PredictionMarketMakerAdmin is the platform-only control plane for global
// UP_DOWN liquidity strategies, verified robot bindings, and dynamic readiness.
service PredictionMarketMakerAdmin {
  rpc GetSymbolConfiguration(GetMarketMakerSymbolConfigurationRequest) returns (GetMarketMakerSymbolConfigurationResponse);
  rpc SaveSymbolConfiguration(SaveMarketMakerSymbolConfigurationRequest) returns (SaveMarketMakerSymbolConfigurationResponse);
  rpc GetStrategy(GetMarketMakerStrategyRequest) returns (GetMarketMakerStrategyResponse);
  rpc SaveStrategy(SaveMarketMakerStrategyRequest) returns (SaveMarketMakerStrategyResponse);
  rpc ListRobotBindings(ListRobotBindingsRequest) returns (RobotBindingPage);
  rpc UpsertRobotBinding(UpsertRobotBindingRequest) returns (UpsertRobotBindingResponse);
  // DeleteRobotBinding soft-disables the binding and preserves its globally
  // unique user reservation and audit history.
  rpc DeleteRobotBinding(DeleteRobotBindingRequest) returns (DeleteRobotBindingResponse);
  rpc GetReadiness(GetMarketMakerReadinessRequest) returns (MarketMakerReadiness);
  // Readonly operational facts; never schedules work or calls funding.
  rpc ListRuntimeStatuses(ListMarketMakerRuntimeStatusesRequest) returns (MarketMakerRuntimeStatusPage);
}

message MarketMakerStrategy {
  string market_id = 1;
  string symbol = 2;
  bool enabled = 3;
  string initial_total_stake_min = 4;
  string initial_total_stake_max = 5;
  int32 orders_per_side_min = 6;
  int32 orders_per_side_max = 7;
  bool dynamic_replenishment_enabled = 8;
  string replenishment_deviation_percent = 9;
  int64 order_interval_ms = 10;
  int64 stop_before_bet_close_seconds = 11;
  string max_total_pool_imbalance = 12;
  string target_up_ratio_min_percent = 13;
  string target_up_ratio_max_percent = 14;
  int64 version = 15;
  string published_by = 16;
  int64 published_at_ms = 17;
}

message GetMarketMakerStrategyRequest {
  string market_id = 1;
  string symbol = 2;
}

message GetMarketMakerStrategyResponse {
  MarketMakerStrategy strategy = 1;
}

message SaveMarketMakerStrategyRequest {
  string client_request_id = 1;
  string reason = 2;
  int64 based_on_version = 3;
  string market_id = 4;
  string symbol = 5;
  bool enabled = 6;
  string initial_total_stake_min = 7;
  string initial_total_stake_max = 8;
  int32 orders_per_side_min = 9;
  int32 orders_per_side_max = 10;
  bool dynamic_replenishment_enabled = 11;
  string replenishment_deviation_percent = 12;
  int64 order_interval_ms = 13;
  int64 stop_before_bet_close_seconds = 14;
  string max_total_pool_imbalance = 15;
  string target_up_ratio_min_percent = 16;
  string target_up_ratio_max_percent = 17;
}

message SaveMarketMakerStrategyResponse {
  MarketMakerStrategy strategy = 1;
  OperationReceipt receipt = 2;
}

message RobotBinding {
  string agent_id = 1;
  int64 user_id = 2;
  string owner_agent_id = 3;
  string home_site_id = 4;
  bool enabled = 5;
  int64 version = 6;
  string created_by = 7;
  string updated_by = 8;
  int64 created_at_ms = 9;
  int64 updated_at_ms = 10;
}

message ListRobotBindingsRequest {
  string agent_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message RobotBindingPage {
  repeated RobotBinding items = 1;
  string next_cursor = 2;
}

message UpsertRobotBindingRequest {
  string client_request_id = 1;
  string reason = 2;
  int64 based_on_version = 3;
  string agent_id = 4;
  int64 user_id = 5;
  string owner_agent_id = 6;
  string home_site_id = 7;
  bool enabled = 8;
}

message UpsertRobotBindingResponse {
  RobotBinding binding = 1;
  OperationReceipt receipt = 2;
}

message DeleteRobotBindingRequest {
  string client_request_id = 1;
  string reason = 2;
  int64 based_on_version = 3;
  string agent_id = 4;
  int64 user_id = 5;
}

message DeleteRobotBindingResponse {
  RobotBinding binding = 1;
  OperationReceipt receipt = 2;
}

enum MarketMakerReadinessState {
  MARKET_MAKER_READINESS_STATE_UNSPECIFIED = 0;
  MARKET_MAKER_READINESS_STATE_MAKER_DISABLED = 1;
  MARKET_MAKER_READINESS_STATE_READY = 2;
  MARKET_MAKER_READINESS_STATE_BLOCKED = 3;
}

enum MarketMakerReadinessBlocker {
  MARKET_MAKER_READINESS_BLOCKER_UNSPECIFIED = 0;
  MARKET_MAKER_READINESS_BLOCKER_STRATEGY_MISSING = 1;
  MARKET_MAKER_READINESS_BLOCKER_SITE_BINDING_MISSING = 2;
  MARKET_MAKER_READINESS_BLOCKER_SITE_BINDING_DRAINING = 3;
  MARKET_MAKER_READINESS_BLOCKER_ROBOT_HOME_SITE_MISMATCH = 4;
  MARKET_MAKER_READINESS_BLOCKER_ROBOT_BINDINGS_INSUFFICIENT = 5;
}

enum MarketMakerSiteBindingState {
  MARKET_MAKER_SITE_BINDING_STATE_UNSPECIFIED = 0;
  MARKET_MAKER_SITE_BINDING_STATE_UNBOUND = 1;
  MARKET_MAKER_SITE_BINDING_STATE_DRAINING = 2;
  MARKET_MAKER_SITE_BINDING_STATE_ACTIVE = 3;
}

message GetMarketMakerReadinessRequest {
  string agent_id = 1;
  string market_id = 2;
  string symbol = 3;
}

message MarketMakerReadiness {
  MarketMakerReadinessState state = 1;
  MarketMakerStrategy strategy = 2;
  string tenant_id = 3;
  string routing_site_id = 4;
  uint64 site_binding_version = 5;
  MarketMakerSiteBindingState site_binding_state = 6;
  int64 enabled_robot_count = 7;
  int64 usable_robot_count = 8;
  int64 required_enabled_robots = 9;
  int32 effective_orders_per_side_max = 10;
  repeated MarketMakerReadinessBlocker blockers = 11;
}

// Filters only narrow Prediction-known canonical agents and fixed UP_DOWN markets.
message ListMarketMakerRuntimeStatusesRequest {
  string agent_id = 1;
  string market_id = 2;
  // Zero defaults to 50; supported explicit range is 1..200.
  int32 page_size = 3;
  // Opaque, bound to principal, filters, page size and binary lexical scope order.
  string cursor = 4;
}
message MarketMakerRuntimeStatusPage {
  repeated MarketMakerRuntimeStatus items = 1;
  string next_cursor = 2;
  // UTC database observation time for this page's coherent readonly snapshot.
  int64 observed_at_ms = 3;
}
enum MarketMakerWorkerHealth {
  MARKET_MAKER_WORKER_HEALTH_UNSPECIFIED = 0;
  // No durable heartbeat evidence exists. Readiness and leases do not prove health.
  MARKET_MAKER_WORKER_HEALTH_UNAVAILABLE = 1;
}
enum MarketMakerRuntimeBatchKind {
  MARKET_MAKER_RUNTIME_BATCH_KIND_UNSPECIFIED = 0;
  MARKET_MAKER_RUNTIME_BATCH_KIND_INITIAL = 1;
  MARKET_MAKER_RUNTIME_BATCH_KIND_REPLENISHMENT = 2;
}
enum MarketMakerRuntimeBatchState {
  MARKET_MAKER_RUNTIME_BATCH_STATE_UNSPECIFIED = 0;
  MARKET_MAKER_RUNTIME_BATCH_STATE_PLANNED = 1;
  MARKET_MAKER_RUNTIME_BATCH_STATE_FUNDING = 2;
  MARKET_MAKER_RUNTIME_BATCH_STATE_COMPENSATING = 3;
  MARKET_MAKER_RUNTIME_BATCH_STATE_COMPENSATED = 4;
  MARKET_MAKER_RUNTIME_BATCH_STATE_ACTIVATED = 5;
}
message MarketMakerRuntimeStatus {
  string agent_id = 1;
  string market_id = 2;
  string symbol = 3;
  MarketMakerReadiness readiness = 4;
  MarketMakerWorkerHealth worker_health = 5;
  // Latest persisted model-v2 round by created_at, round_id, including FINISHED.
  // This is not the player's current display-window round. Absent if none exists.
  MarketMakerRuntimeRound current_round = 6;
  // Highest attempt_no of current_round; absent when it has no persisted attempt.
  MarketMakerRuntimeBatch current_batch = 7;
  // Nonterminal attempts on other rounds, independent of current readiness.
  int64 older_unresolved_batch_count = 8;
  // At most one oldest other-round nonterminal attempt, ordered created_at,batch_id.
  MarketMakerRuntimeBatch oldest_unresolved_batch = 9;
  MarketMakerRuntimeDiagnostic recent_diagnostic = 10;
}
message MarketMakerRuntimeRound {
  string round_id = 1;
  RoundState state = 2;
  uint64 site_binding_version = 3;
  int64 created_at_ms = 4;
}
// Observational persisted counters/state, never proof or authorization for funds.
message MarketMakerRuntimeBatch {
  string batch_id = 1;
  string initialization_id = 2;
  string round_id = 3;
  uint64 site_binding_version = 4;
  MarketMakerRuntimeBatchKind kind = 5;
  MarketMakerRuntimeBatchState state = 6;
  uint64 attempt_no = 7;
  // Lower-numbered COMPENSATED attempts of the same kind and initialization.
  int64 prior_compensated_attempt_count = 8;
  int64 planned_order_count = 9;
  // READY or PROCESSING commands; UNKNOWN is counted separately.
  int64 pending_command_count = 10;
  int64 unknown_command_count = 11;
  int64 manual_required_order_count = 12;
  int64 refund_pending_order_count = 13;
  int64 refunded_order_count = 14;
  // Missing order/Direct Saga/original Debit, including funding mode mismatches.
  int64 missing_funding_order_count = 15;
  // Sum of persisted command attempt_count; not batch retry count.
  int64 command_attempt_count = 16;
  // Earliest persisted next_attempt_at of READY/PROCESSING/UNKNOWN commands.
  optional int64 next_command_attempt_at_ms = 17;
  // May be a claim or release backoff fence; does not prove worker health.
  optional int64 lease_until_ms = 18;
  uint64 lease_version = 19;
  int64 updated_at_ms = 20;
  // NULL is absent; no error value does not establish successful execution.
  optional string last_error = 21;
}
message MarketMakerRuntimeDiagnostic {
  string batch_id = 1;
  string round_id = 2;
  // Latest nonempty persisted batch diagnostic; not a complete error history.
  string message = 3;
  // Batch row update time, not diagnostic occurrence or acceptance time.
  int64 batch_updated_at_ms = 4;
}

// Coin control and changed rooms commit atomically under one audited request.
message MarketMakerSymbolConfiguration {
  string symbol = 1;
  bool enabled = 2;
  int64 version = 3;
  repeated MarketMakerStrategy rooms = 4;
}
message GetMarketMakerSymbolConfigurationRequest { string symbol = 1; }
message GetMarketMakerSymbolConfigurationResponse { MarketMakerSymbolConfiguration configuration = 1; }
message MarketMakerSymbolRoomChange {
  int64 based_on_version = 1;
  MarketMakerStrategy strategy = 2;
}
message SaveMarketMakerSymbolConfigurationRequest {
  string client_request_id = 1;
  string reason = 2;
  string symbol = 3;
  int64 based_on_version = 4;
  bool enabled = 5;
  repeated MarketMakerSymbolRoomChange rooms = 6;
}
message SaveMarketMakerSymbolConfigurationResponse {
  MarketMakerSymbolConfiguration configuration = 1;
  OperationReceipt receipt = 2;
}
