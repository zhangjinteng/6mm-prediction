syntax = "proto3";

package prediction.v1;

option go_package = "prediction-service/api/proto/prediction/v1;predictionv1";

enum GameType {
  GAME_TYPE_UNSPECIFIED = 0;
  GAME_TYPE_UP_DOWN = 1;
  GAME_TYPE_HIGH_LOW = 2;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_UP = 1;
  DIRECTION_DOWN = 2;
}

enum BusinessStatus {
  BUSINESS_STATUS_UNSPECIFIED = 0;
  BUSINESS_STATUS_PENDING = 1;
  BUSINESS_STATUS_ACTIVE = 2;
  BUSINESS_STATUS_RESULT_READY = 3;
  BUSINESS_STATUS_SETTLED = 4;
  BUSINESS_STATUS_CANCELED = 5;
}

enum FundStatus {
  FUND_STATUS_UNSPECIFIED = 0;
  FUND_STATUS_PENDING = 1;
  FUND_STATUS_DEBITED = 2;
  FUND_STATUS_SETTLE_PENDING = 3;
  FUND_STATUS_SETTLED = 4;
  FUND_STATUS_REFUND_PENDING = 5;
  FUND_STATUS_REFUNDED = 6;
  FUND_STATUS_UNKNOWN = 7;
  FUND_STATUS_REJECTED = 8;
  FUND_STATUS_MANUAL_REQUIRED = 9;
}

enum OrderResult {
  ORDER_RESULT_UNSPECIFIED = 0;
  ORDER_RESULT_PENDING = 1;
  ORDER_RESULT_WIN = 2;
  ORDER_RESULT_LOSE = 3;
  ORDER_RESULT_DRAW = 4;
  ORDER_RESULT_CANCELED = 5;
}

enum RoundState {
  ROUND_STATE_UNSPECIFIED = 0;
  ROUND_STATE_PREPARING = 1;
  ROUND_STATE_BETTING = 2;
  ROUND_STATE_LOCKED = 3;
  ROUND_STATE_OBSERVING = 4;
  ROUND_STATE_RESULTING = 5;
  ROUND_STATE_SETTLING = 6;
  ROUND_STATE_FINISHED = 7;
}

enum RoundCancelReason {
  ROUND_CANCEL_REASON_UNSPECIFIED = 0;
  ROUND_CANCEL_REASON_SINGLE_SIDED_POOL = 1;
  ROUND_CANCEL_REASON_NO_VALID_PRICE = 2;
  ROUND_CANCEL_REASON_SITE_BINDING_DRAIN = 3;
}

enum UpDownRoundOutcome {
  UP_DOWN_ROUND_OUTCOME_UNSPECIFIED = 0;
  UP_DOWN_ROUND_OUTCOME_PENDING = 1;
  UP_DOWN_ROUND_OUTCOME_UP = 2;
  UP_DOWN_ROUND_OUTCOME_DOWN = 3;
  UP_DOWN_ROUND_OUTCOME_DRAW = 4;
  UP_DOWN_ROUND_OUTCOME_CANCELED = 5;
}

enum UpDownPoolState {
  UP_DOWN_POOL_STATE_UNSPECIFIED = 0;
  UP_DOWN_POOL_STATE_OPEN = 1;
  UP_DOWN_POOL_STATE_LOCKED = 2;
  UP_DOWN_POOL_STATE_SETTLING = 3;
  UP_DOWN_POOL_STATE_SETTLED = 4;
  UP_DOWN_POOL_STATE_CANCELED = 5;
}

enum UpDownPoolCancelReason {
  UP_DOWN_POOL_CANCEL_REASON_UNSPECIFIED = 0;
  UP_DOWN_POOL_CANCEL_REASON_EMPTY_POOL = 1;
  UP_DOWN_POOL_CANCEL_REASON_SINGLE_SIDED_POOL = 2;
  UP_DOWN_POOL_CANCEL_REASON_SITE_BINDING_DRAIN = 3;
}

enum PlayerErrorReason {
  PLAYER_ERROR_REASON_UNSPECIFIED = 0;
  PLAYER_ERROR_REASON_MARKET_DISABLED = 1;
  PLAYER_ERROR_REASON_ROUND_NOT_FOUND = 2;
  PLAYER_ERROR_REASON_ROUND_CLOSED = 3;
  PLAYER_ERROR_REASON_STAKE_TIER_NOT_FOUND = 4;
  PLAYER_ERROR_REASON_STAKE_OUT_OF_RANGE = 5;
  PLAYER_ERROR_REASON_POOL_VERSION_CONFLICT = 6;
  PLAYER_ERROR_REASON_IDEMPOTENCY_CONFLICT = 7;
  PLAYER_ERROR_REASON_PRICE_UNAVAILABLE = 8;
  PLAYER_ERROR_REASON_FUNDS_REJECTED = 9;
  PLAYER_ERROR_REASON_FUNDS_OUTCOME_UNKNOWN = 10;
  PLAYER_ERROR_REASON_RESYNC_REQUIRED = 11;
  PLAYER_ERROR_REASON_SNAPSHOT_TOKEN_INVALID = 12;
  PLAYER_ERROR_REASON_ODDS_BELOW_MINIMUM = 13;
}

enum PlayerOrderView {
  PLAYER_ORDER_VIEW_UNSPECIFIED = 0;
  PLAYER_ORDER_VIEW_HOLDINGS = 1;
  PLAYER_ORDER_VIEW_HISTORY = 2;
}

enum OrderSource {
  ORDER_SOURCE_UNSPECIFIED = 0;
  ORDER_SOURCE_PLAYER = 1;
  ORDER_SOURCE_MARKET_MAKER = 2;
}

enum AdminAction {
  ADMIN_ACTION_UNSPECIFIED = 0;
  ADMIN_ACTION_PLATFORM_CONFIG_SAVE = 1;
  ADMIN_ACTION_RULE_DRAFT_SAVE = 2;
  ADMIN_ACTION_RULE_DRAFT_PUBLISH = 3;
  ADMIN_ACTION_RULE_VERSION_TOGGLE = 4;
  ADMIN_ACTION_OUTBOX_REQUEUE = 5;
  ADMIN_ACTION_PLATFORM_TEMPLATE_DRAFT_SAVE = 6;
  ADMIN_ACTION_PLATFORM_TEMPLATE_PUBLISH = 7;
  ADMIN_ACTION_PLATFORM_TEMPLATE_ACTIVATE = 8;
  ADMIN_ACTION_AGENT_CONFIG_DRAFT_SAVE = 9;
  ADMIN_ACTION_AGENT_CONFIG_PUBLISH = 10;
  ADMIN_ACTION_AGENT_OVERRIDE_DISABLE = 11;
  ADMIN_ACTION_AGENT_CONFIG_RESET = 12;
  ADMIN_ACTION_AGENT_CONFIG_RECONCILE = 13;
  ADMIN_ACTION_TEMPLATE_RECONCILIATION_START = 14;
  ADMIN_ACTION_MARKET_MAKER_STRATEGY_SAVE = 15;
  ADMIN_ACTION_MARKET_MAKER_ROBOT_BINDING_UPSERT = 16;
  ADMIN_ACTION_MARKET_MAKER_ROBOT_BINDING_DELETE = 17;
  ADMIN_ACTION_SITE_BINDING_PREPARE = 18;
  ADMIN_ACTION_SITE_BINDING_COMMIT = 19;
  ADMIN_ACTION_SITE_BINDING_CANCEL = 20;
  ADMIN_ACTION_PLATFORM_ROBOT_REGISTER = 21;
  ADMIN_ACTION_PLATFORM_ROBOT_ENABLED_SET = 22;
  ADMIN_ACTION_SITE_CONFIG_PUBLISH = 23;
  ADMIN_ACTION_OWNER_CONFIG_PUBLISH = 24;
  ADMIN_ACTION_PLATFORM_ROBOT_AUTO_DEPOSIT_POLICY_SAVE = 25;
  ADMIN_ACTION_PLATFORM_ROBOT_REMOVE = 26;
}

enum OperationResult {
  OPERATION_RESULT_UNSPECIFIED = 0;
  OPERATION_RESULT_SUCCEEDED = 1;
  OPERATION_RESULT_FAILED = 2;
}

enum ConfigValidationStatus {
  CONFIG_VALIDATION_STATUS_UNSPECIFIED = 0;
  CONFIG_VALIDATION_STATUS_VALID = 1;
  CONFIG_VALIDATION_STATUS_ADJUSTED = 2;
  CONFIG_VALIDATION_STATUS_DISABLED = 3;
}

// ErrorCode 是 Gateway 映射 gRPC status 和外部响应时使用的稳定业务错误码。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_OUTCOME_UNKNOWN = 6;
  ERROR_CODE_UNAVAILABLE = 7;
  ERROR_CODE_CANCELED = 8;
  ERROR_CODE_INTERNAL = 9;
  ERROR_CODE_MARK_PRICE_UNAVAILABLE = 10;
}

enum MarkPriceUnavailableReason {
  MARK_PRICE_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  MARK_PRICE_UNAVAILABLE_REASON_MISSING = 1;
  MARK_PRICE_UNAVAILABLE_REASON_STALE = 2;
  MARK_PRICE_UNAVAILABLE_REASON_SOURCE_UNAVAILABLE = 3;
}

// PredictionErrorDetail 可放入 gRPC status details；message 只提供中文诊断，不作为业务分支依据。
message PredictionErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  optional int64 current_template_version = 3;
  string symbol = 4;
  MarkPriceUnavailableReason mark_price_unavailable_reason = 5;
  PlayerErrorReason player_reason = 6;
  string round_id = 7;
  string stake_tier_id = 8;
  uint64 current_entity_version = 9;
}

message DecimalConstraint {
  string default_value = 1;
  string minimum_value = 2;
  string maximum_value = 3;
  bool agent_editable = 4;
}

message IntegerConstraint {
  int64 default_value = 1;
  int64 minimum_value = 2;
  int64 maximum_value = 3;
  bool agent_editable = 4;
}

message PriceRule {
  int64 max_age_milliseconds = 1;
  int64 late_arrival_grace_milliseconds = 2;
  // Absent preserves legacy behavior; explicit zero truncates to integer.
  optional int32 price_decimals = 3;
}

message PricePoint {
  string symbol = 1;
  string price = 2;
  int64 event_time_ms = 3;
  int64 received_at_ms = 4;
  uint64 local_sequence = 5;
  string quality = 6;
  int64 mark_price_tick_id = 7;
  optional uint64 producer_sequence = 8;
  optional int32 source_count = 9;
  string provider_version = 10;
}

message Room {
  string code = 1;
  string min_stake = 2;
  string max_stake = 3;
}

message UpDownRule {
  // UP_DOWN 固定为 30 秒下注开放；历史快照仍可能携带旧值。
  int64 bet_duration_seconds = 1;
  // 页面房间时长；新配置固定为 5/10/15/30/60 秒。
  int64 observe_duration_seconds = 2;
  int64 settlement_display_seconds = 3;
  string pool_share = 4;
  repeated Room rooms = 5;
}

message HighLowRule {
  int64 duration_seconds = 1;
  string net_return_rate = 2;
  string min_stake = 3;
  string max_stake = 4;
}

message Gameplay {
  GameType game_type = 1;
  string symbol = 2;
  // 完整周期；UP_DOWN 页面房间时长为 duration_seconds - 30 秒。
  int64 duration_seconds = 3;
  int64 config_version = 4;
  string settlement_asset = 5;
  int32 amount_scale = 6;
  PriceRule price_rule = 7;
  oneof rule {
    UpDownRule up_down = 8;
    HighLowRule high_low = 9;
  }
  int64 template_version = 10;
  int64 agent_version = 11;
  string effective_version = 12;
  bool enabled = 13;
  string minimum_stake = 14;
  string maximum_stake = 15;
  string fixed_odds = 16;
  string target_payout_rate = 17;
  string minimum_odds = 18;
  string maximum_odds = 19;
  int64 bet_open_seconds = 20;
  string market_id = 21;
  repeated StakeTier stake_tiers = 22;
  // SITE_V1 配置归属，独立于玩家 agent 与资金 home_site。
  string config_site_id = 23;
  int64 site_config_version = 24;
  string config_owner_agent_id = 25;
  int64 owner_config_revision = 26;
  int64 rule_epoch = 27;
  string config_model = 28;
}

message Odds {
  string numerator = 1;
  string denominator = 2;
}

message StakeTier {
  string stake_tier_id = 1;
  int32 display_order = 2;
  string minimum_stake = 3;
  string maximum_stake = 4;
  bool enabled = 5;
}

message UpDownPool {
  string stake_tier_id = 1;
  int32 display_order = 2;
  string minimum_stake = 3;
  string maximum_stake = 4;
  string pool_share = 5;
  string up_pool = 6;
  string down_pool = 7;
  Odds estimated_up_odds = 8;
  Odds estimated_down_odds = 9;
  Odds final_up_odds = 10;
  Odds final_down_odds = 11;
  UpDownPoolState state = 12;
  UpDownPoolCancelReason cancel_reason = 13;
  int64 participant_count = 14;
  int64 order_count = 15;
  uint64 pool_version = 16;
  string round_id = 17;
}

message PlayerRound {
  string round_id = 1;
  string symbol = 2;
  string room_code = 3 [deprecated = true];
  RoundState state = 4;
  OrderResult result = 5;
  RoundCancelReason cancel_reason = 6;
  int64 config_version = 7;
  string settlement_asset = 8;
  string pool_share = 9 [deprecated = true];
  string up_pool = 10 [deprecated = true];
  string down_pool = 11 [deprecated = true];
  Odds up_odds = 12 [deprecated = true];
  Odds down_odds = 13 [deprecated = true];
  optional string start_price = 14;
  optional string end_price = 15;
  int64 bet_open_at_ms = 16;
  int64 bet_close_at_ms = 17;
  int64 observe_end_at_ms = 18;
  int64 display_end_at_ms = 19;
  // 完整周期；UP_DOWN 页面房间时长为 duration_seconds - 30 秒。
  int64 duration_seconds = 20;
  int64 participant_count = 21 [deprecated = true];
  int64 order_count = 22 [deprecated = true];
  string market_id = 23;
  uint64 round_version = 24;
  UpDownRoundOutcome outcome = 25;
  repeated UpDownPool pools = 26;
}

message PlayerOrderSummary {
  string order_id = 1;
  GameType game_type = 2;
  string symbol = 3;
  Direction direction = 4;
  string settlement_asset = 5;
  string stake = 6;
  string estimated_net_profit = 7;
  string estimated_return = 8;
  optional string final_net_profit = 9;
  optional string final_return = 10;
  BusinessStatus business_status = 11;
  FundStatus fund_status = 12;
  FundStatus unknown_from = 13;
  OrderResult result = 14;
  int64 config_version = 15;
  int64 created_at_ms = 16;
  optional int64 accepted_at_ms = 17;
  optional int64 expire_at_ms = 18;
  optional int64 result_at_ms = 19;
  optional int64 settled_at_ms = 20;
  string round_id = 21;
  // 完整周期；UP_DOWN 页面房间时长为 duration_seconds - 30 秒。
  int64 duration_seconds = 22;
  string client_request_id = 23;
  string market_id = 24;
  string stake_tier_id = 25;
  uint64 order_version = 26;
}

message PriceEvidence {
  string evidence_type = 1;
  string price = 2;
  int64 event_time_ms = 3;
  int64 received_at_ms = 4;
  uint64 local_sequence = 5;
  optional uint64 producer_sequence = 6;
  string quality = 7;
  string provider_version = 8;
  string invalid_reason = 9;
  int64 mark_price_tick_id = 10;
  optional int32 source_count = 11;
  string mark_price_text = 12;
  int64 producer_timestamp_ms = 13;
  string source_subject = 14;
  bytes source_payload_hash = 15;
  string source_payload_text = 16;
  string selection_rule_version = 17;
}

message PlayerUpDownOrderDetail {
  string round_id = 1;
  string room_code = 2;
  string final_odds_numerator = 3;
  string final_odds_denominator = 4;
  // 完整周期；页面房间时长为 duration_seconds - 30 秒。
  int64 duration_seconds = 5;
}

message PlayerHighLowOrderDetail {
  int64 duration_seconds = 1;
  string net_return_rate = 2;
  string open_price = 3;
  optional string expiry_price = 4;
  string fixed_odds = 5;
}

message PlayerOrderDetail {
  PlayerOrderSummary summary = 1;
  oneof game_detail {
    PlayerUpDownOrderDetail up_down = 2;
    PlayerHighLowOrderDetail high_low = 3;
  }
  repeated PriceEvidence price_evidence = 4;
}

message OperationReceipt {
  string operation_id = 1;
  string operator_id = 2;
  string client_request_id = 3;
  string capability = 4;
  AdminAction action = 5;
  string target_type = 6;
  string target_id = 7;
  string reason = 8;
  bytes before_json = 9;
  bytes after_json = 10;
  OperationResult result = 11;
  string error_code = 12;
  int64 created_at_ms = 13;
  int64 completed_at_ms = 14;
  string source_service = 15;
  string trace_id = 16;
}
