syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

option php_namespace = "Google\\Rpc";
option php_metadata_namespace = "GPBMetadata\\Google\\Rpc";

// Status is the standard gRPC rich error payload carried in grpc-status-details-bin.
message Status {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}
